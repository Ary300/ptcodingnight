# Full stack for Park Tudor Coding Night.
#   docker compose up -d
# G10: a fresh clone plus `cp .env.example .env` must reach a working seeded instance in
# under 10 minutes with no other manual steps.
#
# The judge worker talks to the host Docker daemon to spawn one ephemeral, network-less
# container per submission. That socket mount is the single most sensitive line in this
# file — see the comment on it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptcn
      POSTGRES_PASSWORD: ptcn_dev_password
      POSTGRES_DB: ptcn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptcn -d ptcn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ptcn:ptcn_dev_password@postgres:5432/ptcn?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ptcn:ptcn_dev_password@postgres:5432/ptcn?schema=public
      REDIS_URL: redis://redis:6379
      TEST_DATA_ROOT: /app/data/testcases
    volumes:
      # The worker spawns per-submission judge containers on the host daemon. It does NOT
      # run untrusted code itself. Mounting the socket grants this container effective root
      # on the host, which is why PRD §14 says to deploy the judge on a host with nothing
      # else on it. Never mount this into the web service.
      - /var/run/docker.sock:/var/run/docker.sock
      - testdata:/app/data/testcases

  # Nightly database backup. Restore procedure is documented in README.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ptcn_dev_password
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h postgres -U ptcn -d ptcn -F c
          -f /backups/ptcn-$$(date +%%Y%%m%%d-%%H%%M%%S).dump || true;
        sleep 3600;
      done'

volumes:
  pgdata:
  redisdata:
  testdata:
